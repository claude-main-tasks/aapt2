name: build-aapt2-aarch64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    defaults:
      run:
        shell: bash
    steps:
      - name: Install deps
        run: |
          apt-get update
          apt-get install -y git ca-certificates clang g++ cmake ninja-build pkg-config python3 file binutils \
            libprotobuf-dev protobuf-compiler libpng-dev libexpat1-dev zlib1g-dev libgtest-dev
          protoc --version
          clang++ --version | head -1

      - name: Assert aarch64 host
        run: |
          set -e
          test $(uname -m) = aarch64
          clang++ -dumpmachine | grep -q aarch64

      - name: Clone Android 17 repos
        run: |
          set -ex
          mkdir -p src && cd src
          T=android-17.0.0_r1
          B=https://android.googlesource.com/platform
          git clone --depth=1 --branch $T $B/frameworks/base frameworks_base
          git clone --depth=1 --branch $T $B/frameworks/native frameworks_native
          git clone --depth=1 --branch $T $B/system/core system_core
          git clone --depth=1 --branch $T $B/system/libbase system_libbase
          git clone --depth=1 --branch $T $B/system/libziparchive system_libziparchive
          git clone --depth=1 --branch $T $B/system/logging system_logging
          git clone --depth=1 --branch $T $B/system/incremental_delivery system_incremental_delivery
          git clone --depth=1 --branch $T $B/build/soong build_soong
          mkdir -p frameworks && ln -s ../frameworks_base frameworks/base
          du -sh *

      - name: Show how sources use aconfig flags
        run: |
          cd src
          echo "--- flag includes"
          grep -rhoE '#include [<"][A-Za-z0-9_/]*(flags|android_content_res)[A-Za-z0-9_]*\.h[>"]' frameworks_base/tools/aapt2 frameworks_base/libs/androidfw | sort | uniq -c || true
          echo "--- flag calls"
          grep -rhoE 'android::content::res::[A-Za-z0-9_:]+' frameworks_base/tools/aapt2 frameworks_base/libs/androidfw | sort | uniq -c || true
          echo "--- proto imports"
          grep -h '^import' frameworks_base/tools/aapt2/*.proto || true
          echo "--- proto options"
          grep -h 'optimize_for\|java_package' frameworks_base/tools/aapt2/*.proto || true

      - name: Write CMakeLists.txt
        run: |
          mkdir -p cm
          cat > cm/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.22)
          project(aapt2 C CXX)

          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS ON)
          set(CMAKE_C_STANDARD 17)
          set(CMAKE_C_EXTENSIONS ON)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON)

          set(A ${AOSP_ROOT})
          set(FW ${A}/frameworks_base)
          set(GEN ${CMAKE_BINARY_DIR}/gen)
          file(MAKE_DIRECTORY ${GEN})

          find_library(PROTOBUF_LIB NAMES libprotobuf.a protobuf REQUIRED)
          find_library(PNG_LIB NAMES libpng.a png REQUIRED)
          find_library(EXPAT_LIB NAMES libexpat.a expat REQUIRED)
          find_library(Z_LIB NAMES libz.a z REQUIRED)
          find_program(PROTOC protoc REQUIRED)
          find_package(Threads REQUIRED)

          # A few AOSP translation units rely on these standard headers being
          # included transitively by the platform build. Make that explicit here.
          add_compile_options(-w -D_FILE_OFFSET_BITS=64 -include cstdint -include cstring)

          include_directories(
            ${FW}/libs/androidfw/include
            ${A}/frameworks_native/include
            ${A}/system_incremental_delivery/incfs/util/include
            ${FW}/tools/aapt2
            ${FW}/cmds/idmap2/libidmap2_policies/include
            ${A}/system_core/libutils/include
            ${A}/system_core/libutils/binder/include
            ${A}/system_core/libcutils/include
            ${A}/system_core/libsystem/include
            ${A}/system_core/libprocessgroup/include
            ${A}/system_logging/liblog/include
            ${A}/system_libbase/include
            ${A}/system_libziparchive/include
            ${A}/system_libziparchive/incfs_support/include
            ${A}/build_soong/cc/libbuildversion/include
            ${GEN}
            ${GEN}/frameworks/base/tools/aapt2
            ${CMAKE_SOURCE_DIR}/stubs
          )

          # ---- protobuf sources of aapt2 (canonical paths from the tree root) ----
          set(PROTO_REL frameworks/base/tools/aapt2)
          set(PROTO_SRCS)
          foreach(n ApkInfo Configuration ResourceMetadata Resources ResourcesInternal)
            add_custom_command(
              OUTPUT ${GEN}/${PROTO_REL}/${n}.pb.cc ${GEN}/${PROTO_REL}/${n}.pb.h
              COMMAND ${PROTOC} --proto_path=${A} --cpp_out=${GEN} ${A}/${PROTO_REL}/${n}.proto
              DEPENDS ${A}/${PROTO_REL}/${n}.proto)
            list(APPEND PROTO_SRCS ${GEN}/${PROTO_REL}/${n}.pb.cc)
          endforeach()
          add_custom_target(protos DEPENDS ${PROTO_SRCS})

          # ---- helper to prefix file names ----
          function(prefixed out dir)
            set(res)
            foreach(f ${ARGN})
              list(APPEND res ${dir}/${f})
            endforeach()
            set(${out} ${res} PARENT_SCOPE)
          endfunction()

          # ---- liblog ----
          prefixed(LOG_SRCS ${A}/system_logging/liblog
            event_tag_map.cpp log_event_list.cpp log_event_write.cpp log_time.cpp
            logd_reader.cpp logd_writer.cpp logger_name.cpp logger_read.cpp
            logger_write.cpp logprint.cpp pmsg_reader.cpp pmsg_writer.cpp properties.cpp)
          add_library(a_log STATIC ${LOG_SRCS})
          target_include_directories(a_log PRIVATE ${A}/system_logging/liblog)
          target_compile_definitions(a_log PRIVATE LIBLOG_LOG_TAG=1006 SNET_EVENT_LOG_TAG=1397638484)

          # ---- libcutils (host, linux) ----
          prefixed(CUTILS_SRCS ${A}/system_core/libcutils
            sockets.cpp socket_inaddr_any_server_unix.cpp socket_local_client_unix.cpp
            socket_local_server_unix.cpp socket_network_client_unix.cpp sockets_utils.cpp
            sockets_unix.cpp config_utils.cpp iosched_policy.cpp load_file.cpp
            native_handle.cpp properties.cpp record_stream.cpp strlcpy.c
            canned_fs_config.cpp fs_config.cpp trace-host.cpp ashmem-host.cpp
            fs.cpp hashmap.cpp multiuser.cpp str_parms.cpp)
          add_library(a_cutils STATIC ${CUTILS_SRCS})
          target_include_directories(a_cutils PRIVATE ${A}/system_core/libcutils)

          # ---- libbase ----
          prefixed(BASE_SRCS ${A}/system_libbase
            chrono_utils.cpp cmsg.cpp errors_unix.cpp file.cpp hex.cpp logging.cpp
            mapped_file.cpp parsebool.cpp parsenetaddress.cpp posix_strerror_r.cpp
            process.cpp properties.cpp result.cpp stringprintf.cpp strings.cpp
            test_utils.cpp threads.cpp utf8.cpp)
          add_library(a_base STATIC ${BASE_SRCS})
          target_include_directories(a_base PRIVATE ${A}/system_libbase)

          # ---- libutils (+ binder part) ----
          prefixed(UTILS_SRCS ${A}/system_core/libutils
            FileMap.cpp JenkinsHash.cpp LightRefBase.cpp NativeHandle.cpp Printer.cpp
            StopWatch.cpp SystemClock.cpp Threads.cpp Timers.cpp Tokenizer.cpp misc.cpp
            Looper.cpp
            binder/Errors.cpp binder/RefBase.cpp binder/SharedBuffer.cpp binder/String16.cpp
            binder/String8.cpp binder/StrongPointer.cpp binder/Unicode.cpp binder/VectorImpl.cpp)
          add_library(a_utils STATIC ${UTILS_SRCS})
          target_compile_definitions(a_utils PRIVATE ANDROID_UTILS_REF_BASE_DISABLE_IMPLICIT_CONSTRUCTION)

          # ---- libziparchive ----
          prefixed(ZIP_SRCS ${A}/system_libziparchive
            zip_archive.cc zip_archive_stream_entry.cc zip_cd_entry_map.cc zip_error.cpp zip_writer.cc)
          add_library(a_ziparchive STATIC ${ZIP_SRCS})
          target_compile_definitions(a_ziparchive PRIVATE INCFS_SUPPORT_DISABLED=1)

          # ---- libbuildversion ----
          add_library(a_buildversion STATIC ${A}/build_soong/cc/libbuildversion/libbuildversion.cpp)

          # ---- libandroidfw ----
          prefixed(FW_SRCS ${FW}/libs/androidfw
            ApkAssets.cpp ApkParsing.cpp Asset.cpp AssetDir.cpp AssetManager.cpp
            AssetManager2.cpp AssetsProvider.cpp AttributeResolution.cpp BigBuffer.cpp
            BigBufferStream.cpp ChunkIterator.cpp ConfigDescription.cpp CursorWindow.cpp
            FileStream.cpp Idmap.cpp LoadedArsc.cpp Locale.cpp LocaleData.cpp
            LocaleDataLookup.cpp misc.cpp NinePatch.cpp ObbFile.cpp PosixUtils.cpp
            PathUtils.cpp Png.cpp PngChunkFilter.cpp PngCrunch.cpp ResourceTimer.cpp
            ResourceTypes.cpp ResourceUtils.cpp StreamingZipInflater.cpp StringPool.cpp
            TypeWrappers.cpp Util.cpp ZipFileRO.cpp ZipUtils.cpp)
          # util/map_ptr.h and its non-Android implementation live in
          # system/incremental_delivery, not system/core.
          add_library(a_incfs_utils STATIC
            ${A}/system_incremental_delivery/incfs/util/map_ptr.cpp)
          target_include_directories(a_incfs_utils PUBLIC
            ${A}/system_incremental_delivery/incfs/util/include)

          add_library(a_androidfw STATIC ${FW_SRCS})
          target_compile_definitions(a_androidfw PRIVATE STATIC_ANDROIDFW_FOR_TOOLS)
          target_link_libraries(a_androidfw PUBLIC a_incfs_utils)
          add_dependencies(a_androidfw protos)

          # ---- aapt2 itself ----
          file(GLOB_RECURSE AAPT2_ALL ${FW}/tools/aapt2/*.cpp)
          set(AAPT2_SRCS)
          foreach(f ${AAPT2_ALL})
            # Unicode_data.cpp is generated data included by Unicode.cpp; it is
            # not a standalone translation unit (compiling it separately loses
            # the CharacterProperties declaration).
            if(f MATCHES "/text/Unicode_data\\.cpp$|_test\\.cpp$|_benchmark\\.cpp$|/test/|/integration-tests/|/fuzz|/benchmarks?/|/testdata/")
              continue()
            endif()
            list(APPEND AAPT2_SRCS ${f})
          endforeach()
          list(LENGTH AAPT2_SRCS N_AAPT2)
          message(STATUS "aapt2 sources: ${N_AAPT2}")

          add_executable(aapt2 ${AAPT2_SRCS} ${PROTO_SRCS})
          target_compile_definitions(aapt2 PRIVATE STATIC_ANDROIDFW_FOR_TOOLS)
          target_link_libraries(aapt2 PRIVATE
            -static-libstdc++ -static-libgcc
            -Wl,--start-group
            a_androidfw a_utils a_cutils a_ziparchive a_base a_log a_buildversion
            ${PROTOBUF_LIB} ${PNG_LIB} ${EXPAT_LIB} ${Z_LIB}
            -Wl,--end-group
            Threads::Threads ${CMAKE_DL_LIBS})
          EOF
          mkdir -p cm/stubs
          head -5 cm/CMakeLists.txt

      - name: Configure
        run: |
          set -ex
          cmake -S cm -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DAOSP_ROOT=$PWD/src

      - name: Build (keep going, log everything)
        run: |
          set -o pipefail
          cmake --build build -- -k 0 -j4 2>&1 | tee build.log

      - name: Verify output is aarch64
        run: |
          set -ex
          file build/aapt2
          readelf -h build/aapt2 | tee elf-header.txt
          grep -q 'Machine:.*AArch64' elf-header.txt
          ldd build/aapt2 || true
          build/aapt2 version

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-build-log
          path: build.log

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: aapt2-aarch64
          path: build/aapt2
